name: Android APK
on:
  push:
    branches: [main, work]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '13114758'
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
      - name: Android prerequisites
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973'
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Real Pocket reference-audio inference (CPU, not a mock)
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/pocket.tar.bz2" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-pocket-tts-int8-2026-01-26.tar.bz2
          printf '%s  %s\n' '2f3b88823cbbb9bf0b2477ec8ae7b3fec417b3a87b6bb5f256dba66f2ad967cb' "$RUNNER_TEMP/pocket.tar.bz2" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/pocket"
          tar -xjf "$RUNNER_TEMP/pocket.tar.bz2" -C "$RUNNER_TEMP/pocket"
          pocket="$RUNNER_TEMP/pocket/sherpa-onnx-pocket-tts-int8-2026-01-26"
          dart run tool/pocket_smoke.dart "$pocket" "$pocket/test_wavs/bria.wav" "$RUNNER_TEMP/real-reference-inference.wav"
          dart run tool/pocket_smoke.dart "$pocket" "$pocket/test_wavs/bria.wav" "$RUNNER_TEMP/cancelled.wav" cancel
      - name: Prepare optional private release identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build ARM64 APK (test signed unless private secrets configured)
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release --target-platform android-arm64
      - name: APK checksum
        working-directory: build/app/outputs/flutter-apk
        run: sha256sum app-release.apk > app-release.apk.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AI-Voice-Studio-Android-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Build separate app to preserve the old installation
        env:
          VOICE_STUDIO_SIDE_BY_SIDE: '1'
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter build apk --release --target-platform android-arm64 --no-pub
          cd build/app/outputs/flutter-apk
          cp app-release.apk app-offline-safe-install.apk
          sha256sum app-offline-safe-install.apk > app-offline-safe-install.apk.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AI-Voice-Studio-Offline-Safe-Install-APK
          path: |
            build/app/outputs/flutter-apk/app-offline-safe-install.apk
            build/app/outputs/flutter-apk/app-offline-safe-install.apk.sha256
          if-no-files-found: error
          retention-days: 30
  backend-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Ensure FFmpeg using bounded official Ubuntu repositories
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version | head -n 1
          else
            options=(-o Acquire::Retries=1 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo apt-get "${options[@]}" -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update
            else
              sudo apt-get "${options[@]}" update
            fi
            sudo apt-get "${options[@]}" install -y --no-install-recommends ffmpeg
          fi
      - run: python -m pip install -r backend/requirements.lock.txt pip-audit
      - run: python -m pytest backend/tests -q
      - run: python -m pip_audit -r backend/requirements.lock.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-build, backend-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AI-Voice-Studio-Android-APK
          path: apk
      - name: Publish personal test build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" apk/* --verify-tag
          --title "AI Voice Studio $RELEASE_TAG"
          --notes "Personal test APK. Cloning requires a separately hosted free inference backend. No on-device cloning. See README and model limitations. Test signing is not suitable for trusted production updates."
