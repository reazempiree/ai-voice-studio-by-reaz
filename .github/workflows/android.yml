name: Android APK
on:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
      - name: Android prerequisites
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973'
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Build ARM64 personal test APK
        run: flutter build apk --release --target-platform android-arm64
      - name: APK checksum
        working-directory: build/app/outputs/flutter-apk
        run: sha256sum app-release.apk > app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Voice-Studio-Android-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r backend/requirements.lock.txt pip-audit
      - run: python -m pytest backend/tests -q
      - run: python -m pip_audit -r backend/requirements.lock.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-build, backend-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AI-Voice-Studio-Android-APK
          path: apk
      - name: Publish personal test build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" apk/* --verify-tag
          --title "AI Voice Studio $RELEASE_TAG"
          --notes "Personal test APK. Cloning requires a separately hosted free inference backend. No on-device cloning. See README and model limitations. Test signing is not suitable for trusted production updates."
